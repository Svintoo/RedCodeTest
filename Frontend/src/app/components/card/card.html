<div class="card h-100 shadow" style="width: 18rem">
  <div class="card-body d-flex flex-column">
    <h5 class="card-title">{{ quote().bookTitle }}</h5>

    <p class="card-text mb-1">"{{ quote().text }}"</p>

    <footer class="mt-auto d-flex flex-row justify-content-between align-items-center small">
      <div class="text-muted">Sida {{ quote().page }}</div>
      <span [class.invisible]="!editMode()">
        <button
          type="button"
          class="btn btn-sm btn-primary me-1"
          data-bs-toggle="modal"
          data-bs-target="#addQuoteModal"
          (click)="editQuote(quote().id)"
          title="redigera kort"
        >
          <fa-icon [icon]="faEdit"></fa-icon>
        </button>
        <button
          class="btn btn-sm btn-danger me-1"
          (click)="removeQuote(quote().id)"
          title="ta bort kort"
        >
          <fa-icon [icon]="faTrash"></fa-icon>
        </button>
      </span>
    </footer>
  </div>
</div>
